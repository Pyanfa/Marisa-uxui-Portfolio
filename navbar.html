<header
  class="fixed top-0 left-0 right-0 z-50 w-full bg-transparent pointer-events-none px-4 lg:px-8 pt-4"
>
  <div class="max-w-[1920px] mx-auto w-full">
    <!-- 1. Main Navbar Block -->
    <div class="w-full bg-transparent pointer-events-auto">
      <div
        class="bg-white backdrop-blur-md rounded-[20px] shadow-lg px-8 lg:px-14 py-3 flex items-center justify-between relative z-20 border-b border-white/20"
      >
        <!-- Left Section: Profile Image & Name/Portfolio Title -->
        <div
          class="flex items-center space-x-4 cursor-pointer"
          onclick="switchTab('home')"
        >
          <div
            class="relative w-12 h-12 rounded-full overflow-hidden bg-black flex-shrink-0 border border-gray-100 shadow-sm"
          >
            <img
              src="Asset/Picture/Profile.png"
              alt="Marisa Wangsai"
              class="w-full h-full object-cover"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            />
            <div
              class="hidden w-full h-full bg-black text-white items-center justify-center font-bold text-lg"
            >
              MW
            </div>
          </div>
          <div class="flex flex-col">
            <span
              class="text-[20px] font-medium tracking-tight text-[#505050] leading-tight"
              data-i18n="name"
              >Marisa Wangsai</span
            >
            <span
              class="text-xs text-[#505050] font-light tracking-wide mt-0.5"
              data-i18n="nav.title"
              >Portfolio</span
            >
          </div>
        </div>

        <!-- Right Section: Navigation Links & Actions -->
        <div class="flex items-center space-x-10">
          <!-- Nav Items Container -->
          <nav
            class="relative flex items-center space-x-10 text-[16px] font-normal text-[#505050]"
            id="nav-items-container"
          >
            <!-- Home Link -->
            <button
              id="nav-home"
              onclick="switchTab('home')"
              class="nav-btn hover-lift text-[#505050] hover:text-gray-900 focus:outline-none"
            >
              <span id="label-home" data-i18n="nav.home">Home</span>
            </button>

            <!-- About Me Link -->
            <button
              id="nav-about"
              onclick="switchTab('about')"
              class="nav-btn hover-lift text-gray-700 hover:text-gray-900 focus:outline-none"
            >
              <span id="label-about" data-i18n="nav.about">About Me</span>
            </button>

            <!-- Project Dropdown Group -->
            <div class="relative dropdown-group py-1">
              <button
                id="nav-project"
                onclick="switchTab('project')"
                class="nav-btn hover-lift flex items-center space-x-1.5 text-gray-700 hover:text-gray-900 focus:outline-none"
              >
                <span id="label-project" data-i18n="nav.project">Project</span>
                <i
                  id="project-arrow"
                  class="fa-solid fa-chevron-down text-xs"
                ></i>
              </button>

              <!-- Dropdown Menu -->
              <div
                class="dropdown-menu absolute right-0 top-full mt-1 w-48 bg-white/95 backdrop-blur-md rounded-xl shadow-xl border border-gray-100 py-2 z-30"
              >
                <a
                  href="#"
                  onclick="switchTab('project'); event.preventDefault();"
                  class="hover-lift block px-4 py-2 text-xs text-gray-600 hover:bg-gray-50 hover:text-brand-hoverblue rounded-lg mx-1"
                  >Coral College</a
                >
                <a
                  href="#"
                  onclick="switchTab('project'); event.preventDefault();"
                  class="hover-lift block px-4 py-2 text-xs text-gray-600 hover:bg-gray-50 hover:text-brand-hoverblue rounded-lg mx-1"
                  >Let's Fill</a
                >
                <a
                  href="#"
                  onclick="switchTab('project'); event.preventDefault();"
                  class="hover-lift block px-4 py-2 text-xs text-gray-600 hover:bg-gray-50 hover:text-brand-hoverblue rounded-lg mx-1"
                  >Whisper of Anima</a
                >
                <a
                  href="#"
                  onclick="switchTab('project'); event.preventDefault();"
                  class="hover-lift block px-4 py-2 text-xs text-gray-600 hover:bg-gray-50 hover:text-brand-hoverblue rounded-lg mx-1"
                  >Portfolio Process</a
                >
              </div>
            </div>

            <!-- Active Line Indicator -->
            <div
              id="active-line"
              class="absolute bottom-2.5 h-[3px] bg-brand-blue transition-all duration-300 ease-in-out rounded-full pointer-events-none"
              style="left: 0px; width: 0px"
            ></div>
          </nav>

          <!-- Action Buttons -->
          <div class="flex items-center space-x-3">
            <a
              href="https://mail.google.com/mail/?view=cm&fs=1&to=marisawangsai@gmail.com"
              target="_blank"
              rel="noopener noreferrer"
              class="action-btn px-5 py-2 text-sm font-medium rounded-full flex items-center space-x-2 shadow-sm focus:outline-none"
            >
              <i class="fa-regular fa-paper-plane text-xs"></i>
              <span data-i18n="nav.contact">Contact me</span>
            </a>

            <!-- ปุ่มสลับภาษาเชื่อมต่อกับฟังก์ชัน toggleLanguage เรียบร้อย -->
            <button
              onclick="toggleLanguage()"
              class="action-btn w-16 h-10 text-xs font-medium rounded-full flex items-center justify-center shadow-sm focus:outline-none"
              title="Switch Language"
            >
              <i class="fa-solid fa-arrows-rotate mr-1 text-[10px]"></i>
              <span id="lang-text">EN</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. SECONDARY SUB-NAVBAR -->
    <div
      id="sub-nav"
      class="subnav-container relative z-0 pointer-events-auto -mt-4"
    >
      <div
        class="relative z-10 bg-[#bfdaf7]/95 backdrop-blur-md pt-6 pb-2.5 rounded-b-[24px] max-w-full px-6 flex items-center justify-center space-x-8 text-xs font-medium text-gray-700 shadow-md border-t border-white/2"
      >
        <a
          href="#"
          onclick="switchTab('project'); event.preventDefault();"
          class="hover-lift hover:text-brand-hoverblue transition-colors"
          >Overview</a
        >
        <a
          href="#"
          onclick="switchTab('project'); event.preventDefault();"
          class="hover-lift hover:text-brand-hoverblue transition-colors"
          >User Flow</a
        >
        <a
          href="#"
          onclick="switchTab('project'); event.preventDefault();"
          class="hover-lift hover:text-brand-hoverblue transition-colors"
          >Test</a
        >
        <a
          href="#"
          onclick="switchTab('project'); event.preventDefault();"
          class="hover-lift hover:text-brand-hoverblue transition-colors"
          >Design Decision</a
        >
        <a
          href="#"
          onclick="switchTab('project'); event.preventDefault();"
          class="hover-lift hover:text-brand-hoverblue transition-colors"
          >Final Design</a
        >
        <a
          href="#"
          onclick="switchTab('project'); event.preventDefault();"
          class="hover-lift hover:text-brand-hoverblue transition-colors"
          >Impact</a
        >
      </div>
    </div>
  </div>
</header>
