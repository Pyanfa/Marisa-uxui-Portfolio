<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marisa Wangsai - Portfolio Navigation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&family=Prompt:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- 1. โหลดไฟล์แปลภาษา i18n.js -->
    <script src="i18n.js"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: [
                '"Iosevka Charon"',
                '"Iosevka"',
                '"JetBrains Mono"',
                '"Fira Code"',
                'monospace',
              ],
              sans: [
                '"Iosevka Charon"',
                '"Iosevka"',
                '"JetBrains Mono"',
                '"Fira Code"',
                '"Prompt"',
                'monospace',
              ],
            },
            colors: {
              brand: {
                blue: '#009be3',
                hoverblue: '#030911',
                lightBlue: '#dbeafe',
                subBg: '#cce5ff',
                footerBg: '#030f1c',
              },
            },
          },
        },
      };
    </script>

    <style>
      @font-face {
        font-family: 'Iosevka Charon';
        src: local('Iosevka Charon'), local('Iosevka');
      }

      body,
      button,
      a,
      span,
      h1,
      div {
        font-family: 'Iosevka Charon', 'Iosevka', 'JetBrains Mono', 'Fira Code',
          'Prompt', monospace;
      }

      /* Custom hover lift animations */
      .hover-lift {
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
          background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
      }
      .hover-lift:hover {
        transform: translateY(-3px);
      }
      .hover-lift:active {
        transform: translateY(0px);
      }

      /* Outlined button hover state rule */
      .action-btn {
        transition: all 0.2s ease-in-out;
        background-color: #009be3;
        color: #ffffff;
        border: 2px solid #009be3;
      }
      .action-btn:hover {
        transform: translateY(-3px);
        background-color: transparent !important;
        color: #009be3 !important;
        border-color: #009be3 !important;
      }
      .action-btn:active {
        transform: translateY(0px) !important;
      }

      /* Nav links layout for precise indicator alignment */
      .nav-btn {
        position: relative;
        cursor: pointer;
        user-select: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.25rem;
      }

      /* Subnav container animation */
      .subnav-container {
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.3s ease;
        opacity: 0;
        transform: translateY(-25px);
        visibility: hidden;
        pointer-events: none;
      }
      .subnav-container.open {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
        pointer-events: auto;
      }

      /* Dropdown popover */
      .dropdown-menu {
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        opacity: 0;
        visibility: hidden;
        transform: translateY(8px);
      }
      .dropdown-group:hover .dropdown-menu,
      .dropdown-menu.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
    </style>
  </head>
  <body
    class="bg-transparent text-gray-800 font-mono min-h-screen flex flex-col items-center justify-start p-0 m-0"
  >
    <div
      class="w-full max-w-[1920px] bg-transparent min-h-screen flex flex-col shadow-2xl relative overflow-y-auto overflow-x-hidden"
    >
      <!-- จุดแทรก Navbar -->
      <div id="navbar-container"></div>

      <!-- MAIN CONTENT VIEWS -->
      <main class="flex-1 relative flex flex-col w-full min-h-screen">
        <div id="view-home"></div>
        <div id="view-about"></div>
        <div id="view-project"></div>

        <!-- จุดแทรก Footer -->
        <div id="footer-container"></div>

        <!-- Floating Scroll To Top Button -->
        <button
          onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
          class="action-btn fixed bottom-6 right-6 w-16 h-16 rounded-full flex flex-col items-center justify-center shadow-lg z-40"
          title="Go to top"
        >
          <i class="fa-solid fa-arrow-up text-sm"></i>
          <span class="text-[12px] font-medium leading-none mt-0.5">Top</span>
        </button>
      </main>
    </div>

    <script>
      let currentTab = 'home';

      // ตัวแปรสำหรับจำโปรเจกต์ล่าสุด (ดึงค่าจาก localStorage หรือใช้ Coral College.html เป็นค่าเริ่มต้น)
      let currentProjectFile =
        localStorage.getItem('lastProjectFile') || 'Project/Coral College.html';

      // ฟังก์ชันสำหรับโหลดไฟล์ HTML ย่อยเข้ามาแปะ
      async function loadComponent(id, file) {
        try {
          const response = await fetch(file);
          if (response.ok) {
            const html = await response.text();
            document.getElementById(id).innerHTML = html;

            // ถ้าเป็นหน้าโปรเจกต์ ให้สั่งเริ่มทำงาน Slider ทันทีที่โหลดเสร็จ
            if (id === 'view-project') {
              setTimeout(initUsabilitySlider, 100);
            }
          }
        } catch (error) {
          console.error(`Error loading ${file}:`, error);
        }
      }

      // ฟังก์ชันสำหรับจัดการโหลดไฟล์โปรเจกต์ + บันทึกชื่อไฟล์ลง localStorage
      async function loadProject(projectFile) {
        currentProjectFile = projectFile;
        localStorage.setItem('lastProjectFile', projectFile);
        await loadComponent('view-project', projectFile);
        switchTab('project');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // ฟังก์ชันผูก Animation ให้กับ Project Accordion บนหน้า Home
      function initProjectAccordion() {
        const cards = document.querySelectorAll('.project-card');
        if (!cards.length) return;

        cards.forEach((card) => {
          const overlay = card.querySelector('.card-overlay');
          const content = card.querySelector('.card-content');
          const bgImg = card.querySelector('.card-bg-img');

          card.addEventListener('mouseenter', () => {
            cards.forEach((c) => {
              if (c === card) {
                c.style.flexGrow = '1.5';
                c.style.opacity = '1';

                if (bgImg) bgImg.style.transform = 'scale(1.05)';
                if (overlay) overlay.style.opacity = '1';
                if (content) {
                  content.style.opacity = '1';
                  content.style.transform = 'translateY(0)';
                }
              } else {
                c.style.flexGrow = '0.7';
                c.style.opacity = '0.6';
              }
            });
          });

          card.addEventListener('mouseleave', () => {
            cards.forEach((c) => {
              c.style.flexGrow = '1';
              c.style.opacity = '1';

              const cOverlay = c.querySelector('.card-overlay');
              const cContent = c.querySelector('.card-content');
              const cBgImg = c.querySelector('.card-bg-img');

              if (cBgImg) cBgImg.style.transform = 'scale(1)';
              if (cOverlay) cOverlay.style.opacity = '0';
              if (cContent) {
                cContent.style.opacity = '0';
                cContent.style.transform = 'translateY(1rem)';
              }
            });
          });
        });
      }

      // ปรับปรุงฟังก์ชันคำนวณตำแหน่งเส้นสีฟ้าให้แม่นยำ ไม่หักลบค่าเกินจริง
      function updateActiveLine(tabId) {
        const activeBtn = document.getElementById(`nav-${tabId}`);
        const labelElem = document.getElementById(`label-${tabId}`);
        const line = document.getElementById('active-line');
        const container = document.getElementById('nav-items-container');

        if (activeBtn && labelElem && line && container) {
          const containerRect = container.getBoundingClientRect();
          const labelRect = labelElem.getBoundingClientRect();

          const leftOffset = labelRect.left - containerRect.left - 40;
          const textWidth = labelRect.width + 4;

          line.style.left = `${leftOffset}px`;
          line.style.width = `${textWidth}px`;
        }
      }

      async function switchTab(tabId) {
        currentTab = tabId;

        // จัดการซ่อน/แสดง View หลัก (home, about, project)
        const views = {
          home: document.getElementById('view-home'),
          about: document.getElementById('view-about'),
          project: document.getElementById('view-project'),
        };

        Object.keys(views).forEach((key) => {
          if (views[key]) {
            if (key === tabId) {
              views[key].classList.remove('hidden');
              // ถ้าเปิดแท็บโปรเจกต์ ให้เรียกเช็คสไลด์ด้วย
              if (tabId === 'project') {
                setTimeout(initUsabilitySlider, 100);
              }
            } else {
              views[key].classList.add('hidden');
            }
          }
        });

        const subNav = document.getElementById('sub-nav');
        if (subNav) {
          if (tabId === 'project') {
            subNav.classList.add('open');
            if (!document.getElementById('view-project').hasChildNodes()) {
              await loadComponent('view-project', currentProjectFile);
            }
          } else {
            subNav.classList.remove('open');
          }
        }

        updateActiveLine(tabId);
      }

      // โหลดส่วนประกอบทั้งหมดเมื่อหน้าเว็บเริ่มทำงาน
      window.addEventListener('DOMContentLoaded', async () => {
        await loadComponent('navbar-container', 'navbar.html');
        await loadComponent('view-home', 'home.html');
        await loadComponent('view-about', 'about.html');
        await loadComponent('view-project', currentProjectFile);
        await loadComponent('footer-container', 'footer.html');

        initProjectAccordion();

        // ใช้ setTimeout เล็กน้อยเพื่อให้แน่ใจว่าเบราว์เซอร์เรนเดอร์ขนาด Element เสร็จก่อนคำนวณเส้นสีฟ้าตอนเริ่มต้น
        setTimeout(() => {
          switchTab('home');
        }, 50);

        // สั่งอัปเดตภาษาทั้งหมดหลังจาก HTML ย่อยถูกโหลดเข้ามาเรียบร้อยแล้ว
        if (typeof setLanguage === 'function') {
          setLanguage(currentLang);
        }
      });

      window.addEventListener('resize', () => {
        updateActiveLine(currentTab);
      });
    </script>

    <!-- Script สำหรับควบคุม User Flow Toggle (เปิด-ปิด) -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        document.addEventListener('click', function (event) {
          const btn = event.target.closest('#toggleFlowBtn');
          if (!btn) return;

          const overviewContainer = document.getElementById(
            'overviewDiagramContainer'
          );
          const detailedContainer = document.getElementById(
            'detailedFlowContainer'
          );
          const text = document.getElementById('toggleText');
          const icon = document.getElementById('toggleIcon');

          if (!overviewContainer || !detailedContainer || !text || !icon)
            return;

          // เช็คว่าตอนนี้ภาพรายละเอียดซ่อนอยู่หรือไม่ (ถ้าซ่อนอยู่ = กำลังจะเปิด)
          if (detailedContainer.classList.contains('hidden')) {
            // 1. ซ่อนภาพย่อด้านบน
            overviewContainer.classList.add('hidden');

            // 2. แสดงภาพรายละเอียดเต็ม
            detailedContainer.classList.remove('hidden');
            setTimeout(() => {
              detailedContainer.classList.remove('opacity-0');
              detailedContainer.classList.add('opacity-100');
            }, 10);

            text.textContent = 'Hide Detailed Flow';
            icon.classList.remove('fa-chevron-down');
            icon.classList.add('fa-chevron-up');
          } else {
            // 1. ซ่อนภาพรายละเอียดเต็ม
            detailedContainer.classList.remove('opacity-100');
            detailedContainer.classList.add('opacity-0');

            setTimeout(() => {
              detailedContainer.classList.add('hidden');
              // 2. แสดงภาพย่อด้านบนกลับมา
              overviewContainer.classList.remove('hidden');
            }, 300);

            text.textContent = 'View Detailed Flow';
            icon.classList.remove('fa-chevron-up');
            icon.classList.add('fa-chevron-down');
          }
        });
      });
    </script>

    <!-- Script สำหรับควบคุมสไลด์รูปภาพ Usability Testing ทุกๆ 3 วินาที -->
    <script>
      function initUsabilitySlider() {
        const slides = document.querySelectorAll('.slide-item');
        const dots = document.querySelectorAll('.dot');

        if (slides.length === 0) return;

        let currentSlide = 0;

        function showSlide(index) {
          slides.forEach((slide, i) => {
            slide.classList.toggle('opacity-100', i === index);
            slide.classList.toggle('opacity-0', i !== index);
          });
          dots.forEach((dot, i) => {
            dot.classList.toggle('bg-slate-700', i === index);
            dot.classList.toggle('bg-slate-300', i !== index);
          });
        }

        function nextSlide() {
          currentSlide = (currentSlide + 1) % slides.length;
          showSlide(currentSlide);
        }

        // ล้าง setInterval ตัวเก่าเพื่อป้องกันการทำงานซ้อนทับกัน
        if (window.usabilityInterval) {
          clearInterval(window.usabilityInterval);
        }

        // ตั้งเวลาสลับภาพทุกๆ 3 วินาที
        window.usabilityInterval = setInterval(nextSlide, 3000);
      }
    </script>
    <script src="Project/CoralFinal.js"></script>
    <script src="Project/AnimaFinal.js"></script>
    <script src="Project/Lets Fill.js"></script>
  </body>
</html>
